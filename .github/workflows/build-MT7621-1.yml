name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false

    - name: Clone LiuTangLei/tailscale and checkout AWG branch/tag
      run: |
        BASE="https://github.com"
        git clone "${BASE}/LiuTangLei/tailscale.git" tailscale-awg
        cd tailscale-awg
        AWG_REF=$(git branch -r | grep -iE "awg|amnezia|1\.104" | head -n 1 | tr -d ' ' || true)
        if [ -z "$AWG_REF" ]; then
          AWG_REF=$(git tag -l | grep -iE "awg|amnezia|1\.104" | tail -n 1 || true)
        fi
        if [ -n "$AWG_REF" ]; then
          echo "Переключаемся на найденную ветку/тег с AmneziaWG: $AWG_REF"
          git checkout "$AWG_REF"
        fi
        grep -rn '"awg"' cmd/tailscale/

    - name: Build static mipsle softfloat binaries (NO UPX)
      working-directory: tailscale-awg
      env:
        CGO_ENABLED: '0'
        GOOS: linux
        GOARCH: mipsle
        GOMIPS: softfloat
      run: |
        mkdir -p ../out
        go build -trimpath -ldflags="-s -w" -o ../out/tailscaled ./cmd/tailscaled
        go build -trimpath -ldflags="-s -w" -o ../out/tailscale ./cmd/tailscale
        ls -lh ../out/

    - name: Upload Tailscale AWG Binaries
      uses: actions/upload-artifact@v4
      with:
        name: tailscale_awg_1_104_4_mipsle_no_upx
        path: out/*
