name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Inspect 128M boards and partition files
      run: |
        cd trunk
        echo "=== 1. ВСЕ ПЛАТЫ В configs/boards ==="
        find configs/boards -maxdepth 3
        echo "=== 2. ВСЕ ФАЙЛЫ РАЗМЕТКИ РАЗДЕЛОВ ==="
        find configs/boards linux-3.4.x/drivers/mtd -iname "*part*" -o -iname "*mtd*" 2>/dev/null
        echo "=== 3. ПЛАТЫ НА 128M NAND (RM2100 / R6220 / MI-R3G / SMBX) ==="
        grep -rn "0x200000" configs/boards/ || true
