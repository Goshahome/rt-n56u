name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

    - name: Clone source code
      run: |
        cd toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/

    - name: Build Firmware
      run: |
        cwd=`pwd`
        CONFIG_TOOLCHAIN_DIR=${cwd//\//\\\/}\\/toolchain-mipsel
        cd trunk
        
        # Меняем разметку и имя устройства на родные для Smart Box Turbo+
        sed -i 's/^CONFIG_FIRMWARE_PRODUCT_ID=.*$/CONFIG_FIRMWARE_PRODUCT_ID="SMBXTURBO"/g' configs/templates/K2P-USB.config
        sed -i "s/^CONFIG_LINUXDIR=.*$/CONFIG_LINUXDIR=linux-3.4.x/g" configs/templates/K2P-USB.config
        sed -i 's/^CONFIG_FIRMWARE_KERNEL_CONFIG=.*$/CONFIG_FIRMWARE_KERNEL_CONFIG="kernel-3.4.x.config"/g' configs/templates/K2P-USB.config
        
        # Безопасно вырезаем блок сборки GO из Makefile
        sed -i '/go_build:/,/^[a-zA-Z]/ { /go_build:/! { /^[a-zA-Z]/!d } }' tools/Makefile
        sed -i 's/dir_go//g' tools/Makefile
        
        if [ ! -f configs/templates/K2P-USB.config ] ; then
          echo "Config for K2P-USB not found!"
          exit 1
        fi
        
        cp -f configs/templates/K2P-USB.config .config
        sed -i "s/^CONFIG_TOOLCHAIN_DIR=.*$/CONFIG_TOOLCHAIN_DIR=${CONFIG_TOOLCHAIN_DIR}/g" .config
        
        # Переименовываем профиль сборки под разметку Смартбокса
        mv configs/boards/K2P-USB configs/boards/SMBXTURBO
        mv configs/boards/SMBXTURBO/kernel-3.4.x-5.0.config configs/boards/SMBXTURBO/kernel-3.4.x.config
        
        # Отключаем интерактивность конфигуратора старого ядра
        cp -f configs/boards/SMBXTURBO/kernel-3.4.x.config linux-3.4.x/.config
        sed -i 's/silentoldconfig/oldconfig/g' Makefile
        sed -i 's/silentoldconfig/oldconfig/g' linux-3.4.x/Makefile
        
        # Запускаем сборку, принудительно задав короткую версию (блокирует ошибку 64 символов и не требует чтения файлов)
        export BUILD_VERSION="1.0"
        sudo -E KCONFIG_NOSILENTUPDATE=1- sh -c 'yes "" | ./build_firmware_modify SMBXTURBO 0'
        
        sudo mv -f images/*.trx /opt/images/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Padavan_K2P-USB
        path: /opt/images/*.trx
