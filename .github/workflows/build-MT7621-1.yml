name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false

    - name: Clone LiuTangLei/tailscale (AmneziaWG + QUIC)
      run: |
        BASE="https://github.com"
        git clone --depth=1 "${BASE}/LiuTangLei/tailscale.git" tailscale-awg

    - name: Build static mipsle softfloat binaries (NO UPX)
      working-directory: tailscale-awg
      env:
        CGO_ENABLED: '0'
        GOOS: linux
        GOARCH: mipsle
        GOMIPS: softfloat
      run: |
        mkdir -p ../out
        go build -trimpath -ldflags="-s -w" -o ../out/tailscaled ./cmd/tailscaled
        go build -trimpath -ldflags="-s -w" -o ../out/tailscale ./cmd/tailscale
        ls -lh ../out/

    - name: Upload Tailscale AWG Binaries
      uses: actions/upload-artifact@v4
      with:
        name: tailscale_awg_mipsle_no_upx
        path: out/*
