name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Padavan 4.4
      run: |
        BASE="https://github.com"
        git clone --depth=1 "${BASE}/tsl0922/padavan-4.4.git" padavan-4.4

    - name: Setup Go and Node
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        cache: false

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Prepare Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install libtool-bin libltdl-dev gperf python3-docutils autopoint gettext ccache

    - name: Configure and Build SmartBox 4.4 (MT7603E + MT7615E, SMBD, uClibc, 128MB, 0x200000)
      working-directory: padavan-4.4
      run: |
        CFG="trunk/configs/templates/NETGEAR-BZV.config"
        KCFG="trunk/configs/boards/NETGEAR-BZV/kernel-4.4.x.config"
        DTS="trunk/linux-4.4.x/arch/mips/boot/dts/ralink/netgear-bzv.dts"
        
        # 1. Исправляем объём ОЗУ под Smart Box Turbo+ (128 МБ)
        sed -i 's/CONFIG_BOARD_RAM_SIZE=256/CONFIG_BOARD_RAM_SIZE=128/g' "$CFG"
        
        # 2. Направляем раздел калибровок Wi-Fi Factory на смещение 0x100000
        sed -i 's/label = "SC_PART";/label = "Factory";/g' "$DTS"
        sed -i 's/label = "Factory";/label = "Factory_orig";/' "$DTS"
        sed -i '0,/label = "Factory_orig";/{s/label = "Factory_orig";/label = "Factory";/}' "$DTS"
        
        # 3. Включаем связку MT7603E (2.4 ГГц) + MT7615E (5 ГГц) в конфиге ядра NETGEAR-BZV
        sed -i 's/CONFIG_FIRST_IF_MT7615E=y/# CONFIG_FIRST_IF_MT7615E is not set\nCONFIG_FIRST_IF_MT7603E=y/g' "$KCFG"
        sed -n '1585,1664p' trunk/configs/boards/MI-R3G/kernel-4.4.x.config >> "$KCFG"
        
        # 4. Убираем -Werror в драйверах Wi-Fi и ядре 4.4
        find trunk/linux-4.4.x/drivers/net/wireless/mediatek -name "Makefile" -exec sed -i 's/-Werror/-Wno-error/g' {} +
        sed -i 's/-Werror=misleading-indentation/-Wno-misleading-indentation/g' trunk/linux-4.4.x/Makefile
        
        # 5. Включаем русский язык и Samba (SMBD), отключаем остальные лишние сервисы
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_LANG_CN=y/#CONFIG_FIRMWARE_INCLUDE_LANG_CN=y/g' "$CFG"
        sed -i 's/#CONFIG_FIRMWARE_INCLUDE_LANG_RU=y/CONFIG_FIRMWARE_INCLUDE_LANG_RU=y/g' "$CFG"
        sed -i 's/#CONFIG_FIRMWARE_INCLUDE_SMBD=y/CONFIG_FIRMWARE_INCLUDE_SMBD=y/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_SMBD=n/CONFIG_FIRMWARE_INCLUDE_SMBD=y/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSH=y/CONFIG_FIRMWARE_INCLUDE_OPENSSH=n/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_DROPBEAR=n/CONFIG_FIRMWARE_INCLUDE_DROPBEAR=y/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENVPN=y/CONFIG_FIRMWARE_INCLUDE_OPENVPN=n/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_XUPNPD=y/CONFIG_FIRMWARE_INCLUDE_XUPNPD=n/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_HTOP=y/CONFIG_FIRMWARE_INCLUDE_HTOP=n/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_IPERF3=y/CONFIG_FIRMWARE_INCLUDE_IPERF3=n/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y/CONFIG_FIRMWARE_INCLUDE_WIREGUARD=n/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_PARTED=y/CONFIG_FIRMWARE_INCLUDE_PARTED=n/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_ARIA=y/CONFIG_FIRMWARE_INCLUDE_ARIA=n/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL=y/CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL=n/g' "$CFG"
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_TCPDUMP=y/CONFIG_FIRMWARE_INCLUDE_TCPDUMP=n/g' "$CFG"
        
        # 6. Собираем на тулчейне uClibc (для совместимости с Entware и вашим бинарником Tailscale)
        make NETGEAR-BZV TOOLCHAIN=mipsel-linux-uclibc

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Padavan_4_4_SmartBox_WiFi_SMB_uClibc
        path: padavan-4.4/trunk/images/*.trx
