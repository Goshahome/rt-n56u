name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout padavan-ng from GitLab
      run: |
        git clone --depth=1 https://gitlab.com/hadzhioglu/padavan-ng.git padavan-ng
        mkdir -p /opt/images/

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

    - name: Restore Toolchain Cache
      id: cache-toolchain
      uses: actions/cache/restore@v4
      with:
        path: |
          padavan-ng/toolchain/out
          padavan-ng/toolchain/opt
        key: toolchain-mipsel-padavan-ng-v3

    - name: Build Toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        cd padavan-ng/toolchain
        sudo chmod +x build_toolchain.sh
        ./build_toolchain.sh

    - name: Save Toolchain Cache
      if: always() && steps.cache-toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          padavan-ng/toolchain/out
          padavan-ng/toolchain/opt
        key: toolchain-mipsel-padavan-ng-v3

    - name: Build Firmware
      run: |
        set -o pipefail
        GCC_PATH=$(find "$(pwd)/padavan-ng/toolchain" -name "mipsel-linux-uclibc-gcc" -type f | head -n 1)
        TOOLCHAIN_BIN_DIR=$(dirname "$GCC_PATH")
        TOOLCHAIN_ROOT_DIR=$(dirname "$TOOLCHAIN_BIN_DIR")
        export PATH="$TOOLCHAIN_BIN_DIR:$PATH"
        
        sudo ln -sf "$TOOLCHAIN_BIN_DIR"/mipsel-linux-uclibc-* /bin/
        sudo ln -sf "$TOOLCHAIN_BIN_DIR"/mipsel-linux-uclibc-* /usr/local/bin/
        
        printf 'with_python=no\nwith_python3=no\nPTHREAD_LIBS=-lpthread\nax_cv_PTHREAD_LIBS=-lpthread\n' > /tmp/padavan_config.site
        export CONFIG_SITE=/tmp/padavan_config.site
        export PTHREAD_LIBS=-lpthread
        
        cat << 'EOF' > /tmp/fix_tirpc.sh
        #!/bin/sh
        find . -name "Makefile" -exec sed -i 's/@PTHREAD_LIBS@/-lpthread/g; s/PTHREAD_LIBS@/-lpthread/g' {} +
        EOF
        chmod +x /tmp/fix_tirpc.sh
        
        cd padavan-ng/trunk
        
        # Очищаем от Go и фиксим известные баги библиотек
        sed -i '/go_build:/,/^[a-zA-Z]/ { /go_build:/! { /^[a-zA-Z]/!d } }' tools/Makefile
        sed -i 's/dir_go//g' tools/Makefile
        
        if [ -f libs/libcap-ng/Makefile ]; then
          sed -i 's/--without-python\b/--without-python --without-python3/g' libs/libcap-ng/Makefile
        fi
        
        if [ -f libs/libtirpc/Makefile ]; then
          TAB=$(printf '\t')
          sed -i "/^all:/a\\${TAB}/tmp/fix_tirpc.sh" libs/libtirpc/Makefile
        fi
        
        # Копируем родной профиль Smart Box Turbo+
        cp -f configs/templates/sercomm/smbxturbo.config .config
        
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_E2FSPROGS=y/# CONFIG_FIRMWARE_INCLUDE_E2FSPROGS is not set/g' .config
        sed -i 's/e2fsprogs//g' user/Makefile
        
        LINUX_DIR=$(grep '^CONFIG_LINUXDIR=' .config | cut -d'=' -f2 | tr -d '"')
        [ -z "$LINUX_DIR" ] && LINUX_DIR="linux-3.4.x"
        
        KCFG_NAME=$(grep '^CONFIG_FIRMWARE_KERNEL_CONFIG=' .config | cut -d'=' -f2 | tr -d '"')
        KERNEL_CFG=""
        if [ -n "$KCFG_NAME" ]; then
          KERNEL_CFG=$(find configs/boards -name "$KCFG_NAME" | head -n 1)
        fi
        if [ -z "$KERNEL_CFG" ]; then
          KERNEL_CFG=$(find configs/boards -ipath "*smbxturbo*" -name "kernel*.config" | head -n 1)
        fi
        if [ -z "$KERNEL_CFG" ]; then
          KERNEL_CFG=$(find configs/boards -name "kernel-3.4.x.config" | head -n 1)
        fi
        echo "Используем конфиг ядра: $KERNEL_CFG"
        cp -f "$KERNEL_CFG" "$LINUX_DIR/.config"
        
        # Активируем CONFIG_RA_HW_NAT и подключаем оригинальную папку hw_nat
        sed -i 's/# CONFIG_RA_HW_NAT is not set/CONFIG_RA_HW_NAT=m/g' "$LINUX_DIR/.config"
        HW_NAT_DIR=$(find "$(pwd)" -maxdepth 4 -type d -name "hw_nat" | grep -v "$LINUX_DIR/net/nat/hw_nat" | head -n 1)
        if [ -n "$HW_NAT_DIR" ] && [ ! -e "$LINUX_DIR/net/nat/hw_nat" ]; then
          mkdir -p "$LINUX_DIR/net/nat"
          ln -sfn "$HW_NAT_DIR" "$LINUX_DIR/net/nat/hw_nat"
        fi
        
        ESCAPED_ROOT=$(echo "$TOOLCHAIN_ROOT_DIR" | sed 's/\//\\\//g')
        sed -i "s|^CONFIG_TOOLCHAIN_DIR=.*|CONFIG_TOOLCHAIN_DIR=\"${ESCAPED_ROOT}\"|g" .config
        
        echo '#!/bin/sh' > "$LINUX_DIR/scripts/setlocalversion"
        echo 'echo ""' >> "$LINUX_DIR/scripts/setlocalversion"
        chmod +x "$LINUX_DIR/scripts/setlocalversion"
        
        # НЕ трогаем Kconfig (padavan-ng сам использует olddefconfig)
        make dep
        if ! make 2>&1 | tee /tmp/build.log; then
          echo "=== ТОЧНАЯ ПРИЧИНА ОШИБКИ СБОРКИ ==="
          grep -n -C 5 -iE "fatal error:|error:" /tmp/build.log | tail -n 40
          exit 1
        fi
        
        sudo mv -f images/*.trx /opt/images/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Padavan_SmartBox_Turbo_Plus_New_NG
        path: /opt/images/*.trx
