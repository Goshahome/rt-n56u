name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check WiFi config for MT7603 + MT7615 in Padavan 4.4
      run: |
        BASE="https://github.com"
        git clone --depth=1 "${BASE}/tsl0922/padavan-4.4.git" padavan-4.4
        cd padavan-4.4/trunk

        echo "=== 1. СЕКЦИЯ WIFI В NETGEAR-BZV.config ==="
        grep -iE "WIFI|EEPROM|MT76|FLASH" configs/templates/NETGEAR-BZV.config || true

        echo "=== 2. СЕКЦИЯ WIFI В MI-R3G.config ==="
        grep -iE "WIFI|EEPROM|MT76|FLASH" configs/templates/MI-R3G.config || true

        echo "=== 3. NETGEAR-BZV/board.h ==="
        cat configs/boards/NETGEAR-BZV/board.h
