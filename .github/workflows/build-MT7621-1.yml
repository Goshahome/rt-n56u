name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

    - name: Clone source code
      run: |
        cd toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/

    - name: Build Firmware
      run: |
        cwd=`pwd`
        CONFIG_TOOLCHAIN_DIR=${cwd//\//\\\/}\\/toolchain-mipsel
        cd trunk
        
        # Настройка путей под структуру репозитория 4.4
        sed -i "s/^CONFIG_LINUXDIR=.*$/CONFIG_LINUXDIR=linux-3.4.x/g" configs/templates/K2P-USB.config
        sed -i 's/^CONFIG_FIRMWARE_KERNEL_CONFIG=.*$/CONFIG_FIRMWARE_KERNEL_CONFIG="kernel-3.4.x-5.0.config"/g' configs/templates/K2P-USB.config
        
        # Полностью вырезаем упавший пакет GO из Makefile утилит
        sed -i '/go_build:/,/^[a-zA-Z]/ { /go_build:/! { /^[a-zA-Z]/!d } }' tools/Makefile
        sed -i 's/dir_go//g' tools/Makefile
        
        if [ ! -f configs/templates/K2P-USB.config ] ; then
          echo "Config for K2P-USB not found!"
          exit 1
        fi
        
        cp -f configs/templates/K2P-USB.config .config
        sed -i "s/^CONFIG_TOOLCHAIN_DIR=.*$/CONFIG_TOOLCHAIN_DIR=${CONFIG_TOOLCHAIN_DIR}/g" .config
        
        # Заглушка кривых версий Git (убирает ошибку превышения 64 символов)
        echo '#!/bin/sh' > linux-3.4.x/scripts/setlocalversion
        echo 'echo ""' >> linux-3.4.x/scripts/setlocalversion
        chmod +x linux-3.4.x/scripts/setlocalversion
        
        # ИСПРАВЛЕННЫЙ ПЕРЕХВАТ: Принудительно переводим тихий опрос в режим авто-ответов по умолчанию
        sed -i 's/silentoldconfig/olddefconfig/g' linux-3.4.x/scripts/kconfig/Makefile
        sed -i 's/silentoldconfig/olddefconfig/g' Makefile
        sed -i 's/silentoldconfig/olddefconfig/g' linux-3.4.x/Makefile
        
        # Запускаем сборку
        sudo ./build_firmware_modify K2P-USB 0
        
        sudo mv -f images/*.trx /opt/images/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Padavan_K2P-USB
        path: /opt/images/*.trx
