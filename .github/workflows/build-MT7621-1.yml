name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Read official CI build commands
      run: |
        git clone --depth=1 https://gitlab.com/hadzhioglu/padavan-ng.git padavan-ng
        cd padavan-ng
        echo "=== 1. ОФИЦИАЛЬНЫЙ .gitlab-ci.yml ==="
        cat .gitlab-ci.yml
        echo "=== 2. НАЧАЛО trunk/build_firmware.sh ==="
        head -n 120 trunk/build_firmware.sh
        echo "=== 3. ПОИСК ra_nat.h ==="
        find . -iname "*ra_nat*" -o -iname "*hw_nat*" -o -iname "*rt_ppe*"
