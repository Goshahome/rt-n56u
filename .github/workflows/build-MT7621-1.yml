name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout padavan-ng from GitLab
      run: |
        git clone --depth=1 https://gitlab.com/hadzhioglu/padavan-ng.git padavan-ng
        mkdir -p /opt/images/

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

    - name: Cache Toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: |
          padavan-ng/toolchain/out
          padavan-ng/toolchain/opt
        key: toolchain-mipsel-padavan-ng-v2

    - name: Build Toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        cd padavan-ng/toolchain
        sudo chmod +x build_toolchain.sh
        ./build_toolchain.sh

    - name: Build Firmware
      run: |
        GCC_PATH=$(find "$(pwd)/padavan-ng/toolchain" -name "mipsel-linux-uclibc-gcc" -type f | head -n 1)
        TOOLCHAIN_BIN_DIR=$(dirname "$GCC_PATH")
        TOOLCHAIN_ROOT_DIR=$(dirname "$TOOLCHAIN_BIN_DIR")
        echo "Найден тулчейн: $TOOLCHAIN_ROOT_DIR"
        export PATH="$TOOLCHAIN_BIN_DIR:$PATH"
        
        printf 'with_python=no\nwith_python3=no\nPTHREAD_LIBS=-lpthread\nax_cv_PTHREAD_LIBS=-lpthread\n' > /tmp/padavan_config.site
        export CONFIG_SITE=/tmp/padavan_config.site
        export PTHREAD_LIBS=-lpthread
        
        cat << 'EOF' > /tmp/fix_tirpc.sh
        #!/bin/sh
        find . -name "Makefile" -exec sed -i 's/@PTHREAD_LIBS@/-lpthread/g; s/PTHREAD_LIBS@/-lpthread/g' {} +
        EOF
        chmod +x /tmp/fix_tirpc.sh
        
        cd padavan-ng/trunk
        
        sed -i '/go_build:/,/^[a-zA-Z]/ { /go_build:/! { /^[a-zA-Z]/!d } }' tools/Makefile
        sed -i 's/dir_go//g' tools/Makefile
        
        if [ -f libs/libcap-ng/Makefile ]; then
          sed -i 's/--without-python\b/--without-python --without-python3/g' libs/libcap-ng/Makefile
        fi
        
        if [ -f libs/libtirpc/Makefile ]; then
          TAB=$(printf '\t')
          sed -i "/^all:/a\\${TAB}/tmp/fix_tirpc.sh" libs/libtirpc/Makefile
        fi
        
        cp -f configs/templates/sercomm/smbxturbo.config .config
        
        KERNEL_CFG=$(find configs/boards -ipath "*smbxturbo*" -name "kernel*.config" | head -n 1)
        if [ -z "$KERNEL_CFG" ]; then
          KERNEL_CFG=$(find configs/boards -name "kernel-3.4.x.config" | head -n 1)
        fi
        cp -f "$KERNEL_CFG" linux-3.4.x/.config
        
        ESCAPED_ROOT=$(echo "$TOOLCHAIN_ROOT_DIR" | sed 's/\//\\\//g')
        sed -i "s|^CONFIG_TOOLCHAIN_DIR=.*|CONFIG_TOOLCHAIN_DIR=\"${ESCAPED_ROOT}\"|g" .config
        
        echo '#!/bin/sh' > linux-3.4.x/scripts/setlocalversion
        echo 'echo ""' >> linux-3.4.x/scripts/setlocalversion
        chmod +x linux-3.4.x/scripts/setlocalversion
        
        sed -i 's/silentoldconfig/oldnoconfig silentoldconfig/g' linux-3.4.x/scripts/kconfig/Makefile
        sed -i 's/silentoldconfig/oldnoconfig silentoldconfig/g' Makefile
        sed -i 's/silentoldconfig/oldnoconfig silentoldconfig/g' linux-3.4.x/Makefile
        
        if [ -f ./build_firmware.sh ]; then
          chmod +x ./build_firmware.sh
          ./build_firmware.sh
        else
          make CONFIG_TOOLCHAIN_DIR="$TOOLCHAIN_ROOT_DIR" CROSS_COMPILE="$TOOLCHAIN_BIN_DIR/mipsel-linux-uclibc-" dep
          make CONFIG_TOOLCHAIN_DIR="$TOOLCHAIN_ROOT_DIR" CROSS_COMPILE="$TOOLCHAIN_BIN_DIR/mipsel-linux-uclibc-" -j$(nproc)
        fi
        
        sudo mv -f images/*.trx /opt/images/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Padavan_SmartBox_Turbo_Plus_New_NG
        path: /opt/images/*.trx
