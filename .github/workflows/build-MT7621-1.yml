name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout custom toolchain from GitLab
      run: |
        # Скачиваем чистый репозиторий со структурой как на скриншоте
        git clone --depth=1 https://gitlab.com/hadzhioglu/padavan-ng.git padavan-ng
        mkdir -p /opt/images/

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

    - name: Build Firmware
      run: |
        # 1. ЗАХОДИМ В ПАПКУ TOOLCHAIN И ЗАПУСКАЕМ СБОРКУ КОМПИЛЯТОРА
        cd padavan-ng/toolchain
        sh build_toolchain
        
        # 2. ПЕРЕХОДИМ В ПАПКУ TRUNK ДЛЯ СБОРКИ САМОЙ ПРОШИВКИ
        cd ../trunk
        
        # Полностью очищаем софт от упавшего Go, который нам не нужен
        sed -i '/go_build:/,/^[a-zA-Z]/ { /go_build:/! { /^[a-zA-Z]/!d } }' tools/Makefile
        sed -i 's/dir_go//g' tools/Makefile
        
        # Накатываем родной профиль конфигурации Смартбокса из папки templates
        cp -f configs/templates/SMBXTURBO.config .config
        
        # Передаем точный путь к только что собранному компилятору
        cwd=`pwd`
        CONFIG_TOOLCHAIN_DIR=${cwd//\//\\\/}\\/..\\/toolchain\\/mipsel-linux-uclibc
        sed -i "s/^CONFIG_TOOLCHAIN_DIR=.*$/CONFIG_TOOLCHAIN_DIR=${CONFIG_TOOLCHAIN_DIR}/g" .config
        
        # Заглушка кривых версий Git (убирает ошибку превышения 64 символов)
        echo '#!/bin/sh' > linux-4.4.x/scripts/setlocalversion || echo '#!/bin/sh' > linux-3.4.x/scripts/setlocalversion
        echo 'echo ""' >> linux-4.4.x/scripts/setlocalversion || echo 'echo ""' >> linux-3.4.x/scripts/setlocalversion
        chmod +x linux-4.4.x/scripts/setlocalversion || chmod +x linux-3.4.x/scripts/setlocalversion
        
        # Автоматический обход интерактивных вопросов Kconfig
        sed -i 's/silentoldconfig/oldnoconfig silentoldconfig/g' linux-4.4.x/scripts/kconfig/Makefile || sed -i 's/silentoldconfig/oldnoconfig silentoldconfig/g' linux-3.4.x/scripts/kconfig/Makefile
        
        # ЗАПУСКАЕМ СБОРКУ: Скрипт у Сергея называется build_firmware, собираем родной SMBXTURBO под Breed (0)
        sudo ./build_firmware SMBXTURBO 0
        
        sudo mv -f images/*.trx /opt/images/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Padavan_SmartBox_Turbo_Plus_New_NG
        path: /opt/images/*.trx
