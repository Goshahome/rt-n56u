name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check available partition layouts in padavan-ng
      run: |
        git clone --depth=1 https://gitlab.com/hadzhioglu/padavan-ng.git padavan-ng
        cd padavan-ng/trunk/configs/boards
        echo "=== 1. ВСЕ ФАЙЛЫ ТАБЛИЦ РАЗДЕЛОВ (pt_*.config / partitions.config) ==="
        find . -name "*pt_*.config" -o -name "partitions.config"
        echo "=== 2. ПЛАТЫ NETGEAR И ИХ РАЗМЕТКА ==="
        find . -iname "*r6220*" -o -iname "*netgear*"
        cat NETGEAR/R6220/partitions.config 2>/dev/null || find . -iname "*r6220*" -exec head -n 50 {} +
