name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check SMBXTURBO partitions and layout
      run: |
        git clone --depth=1 https://gitlab.com/hadzhioglu/padavan-ng.git padavan-ng
        cd padavan-ng/trunk
        echo "=== 1. СОДЕРЖИМОЕ configs/boards/SERCOMM/SMBXTURBO ==="
        ls -la configs/boards/SERCOMM/SMBXTURBO/
        echo "=== 2. partitions.config ==="
        cat configs/boards/SERCOMM/SMBXTURBO/partitions.config || true
        echo "=== 3. board.mk и board.h ==="
        cat configs/boards/SERCOMM/SMBXTURBO/board.mk || true
        cat configs/boards/SERCOMM/SMBXTURBO/board.h || true
