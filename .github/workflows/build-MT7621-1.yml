name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Compare kernel WiFi configs (MI-R3G vs NETGEAR-BZV)
      run: |
        BASE="https://github.com"
        git clone --depth=1 "${BASE}/tsl0922/padavan-4.4.git" padavan-4.4
        cd padavan-4.4/trunk/configs/boards

        echo "=== 1. NETGEAR-BZV/kernel-4.4.x.config (MT76 / WIFI / EEPROM) ==="
        grep -iE "MT76|WIFI|EEPROM|RALINK|RT28" NETGEAR-BZV/kernel-4.4.x.config || true

        echo "=== 2. MI-R3G/kernel-4.4.x.config (MT76 / WIFI / EEPROM) ==="
        grep -iE "MT76|WIFI|EEPROM|RALINK|RT28" MI-R3G/kernel-4.4.x.config || true

        echo "=== 3. ПЛАТЫ С ДВУМЯ РАЗНЫМИ ЧИПАМИ (7603 + 7615) ==="
        grep -rn "CONFIG_MT7603E" . || true
