name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Inspect DTS and 128M boards in Padavan 4.4
      run: |
        BASE="https://github.com"
        git clone --depth=1 "${BASE}/tsl0922/padavan-4.4.git" padavan-4.4
        cd padavan-4.4/trunk

        echo "=== 1. ВСЕ .DTS ФАЙЛЫ В ЯДРЕ 4.4 ==="
        ls -la linux-4.4.x/arch/mips/boot/dts/ralink/

        echo "=== 2. ВСЕ ПЛАТЫ В configs/boards ==="
        find configs/boards -maxdepth 2

        echo "=== 3. ПЛАТЫ БЕЗ GPT (ИЩЕМ 0x200000 ИЛИ R6220 / NEWIFI / ZYXEL / SERCOMM) ==="
        grep -rn "0x200000\|R6220\|SERCOMM\|SMBX" configs/boards/ linux-4.4.x/drivers/mtd/nand/ || true
