name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check 128M partition tables
      run: |
        git clone --depth=1 https://gitlab.com/hadzhioglu/padavan-ng.git padavan-ng
        cd padavan-ng/trunk/configs/boards
        echo "=== 1. SERCOMM/SMBXPRONAND ==="
        cat SERCOMM/SMBXPRONAND/partitions.config || true
        echo "=== 2. XIAOMI/pt_xiaomi_128m_smalluboot ==="
        cat XIAOMI/pt_xiaomi_128m_smalluboot.config || true
        echo "=== 3. ZYXEL/pt_zyxel_128m ==="
        cat ZYXEL/pt_zyxel_128m.config || true
