name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check mtk_partition.h and NETGEAR-BZV config
      run: |
        BASE="https://github.com"
        git clone --depth=1 "${BASE}/tsl0922/padavan-4.4.git" padavan-4.4
        cd padavan-4.4/trunk

        echo "=== 1. mtk_partition.h ==="
        cat linux-4.4.x/drivers/mtd/nand/mtk_partition.h

        echo "=== 2. NETGEAR-BZV board.mk и template ==="
        cat configs/boards/NETGEAR-BZV/board.mk
        cat configs/templates/NETGEAR-BZV.config

        echo "=== 3. netgear-bzv.dts ==="
        cat linux-4.4.x/arch/mips/boot/dts/ralink/netgear-bzv.dts
