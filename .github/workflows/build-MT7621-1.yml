name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check l1profile, board.h and PAGE_SIZE in Padavan 4.4
      run: |
        BASE="https://github.com"
        git clone --depth=1 "${BASE}/tsl0922/padavan-4.4.git" padavan-4.4
        cd padavan-4.4/trunk/configs/boards

        echo "=== 1. ФЛАГИ PAGE_SIZE В kernel-4.4.x.config ==="
        grep -i "PAGE_SIZE" NETGEAR-BZV/kernel-4.4.x.config || true

        echo "=== 2. NETGEAR-BZV (board.h / board.mk / l1profile) ==="
        ls -la NETGEAR-BZV/
        cat NETGEAR-BZV/board.h NETGEAR-BZV/board.mk NETGEAR-BZV/l1profile.dat 2>/dev/null || true

        echo "=== 3. MI-R3G (board.h / board.mk / l1profile) ==="
        ls -la MI-R3G/
        cat MI-R3G/board.h MI-R3G/board.mk MI-R3G/l1profile.dat 2>/dev/null || true
