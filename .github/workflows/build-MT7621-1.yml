name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout custom toolchain from GitLab
      run: |
        git clone --depth=1 https://gitlab.com/hadzhioglu/padavan-ng.git padavan-ng
        mkdir -p /opt/images/

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

    - name: Build Firmware
      run: |
        # 1. Собираем кросс-компилятор (тулчейн)
        cd padavan-ng/toolchain
        sudo chmod +x build_toolchain.sh
        ./build_toolchain.sh
        
        # 2. Переходим в папку trunk для сборки прошивки
        cd ../trunk
        
        # Очищаем сборку от Go
        sed -i '/go_build:/,/^[a-zA-Z]/ { /go_build:/! { /^[a-zA-Z]/!d } }' tools/Makefile
        sed -i 's/dir_go//g' tools/Makefile
        
        # Находим и копируем родной профиль конфигурации Smart Box Turbo+ (SMBXTURBO)
        CONFIG_FILE=$(find configs -iname "*SMBXTURBO*.config" | head -n 1)
        if [ -z "$CONFIG_FILE" ]; then
          echo "Файл конфигурации для SMBXTURBO не найден!"
          find configs -type f
          exit 1
        fi
        echo "Используем конфигурацию: $CONFIG_FILE"
        cp -f "$CONFIG_FILE" .config
        
        # Прописываем путь к свежесобранному тулчейну
        cwd=`pwd`
        CONFIG_TOOLCHAIN_DIR=${cwd//\//\\\/}\\/..\\/toolchain\\/out
        sed -i "s|^CONFIG_TOOLCHAIN_DIR=.*|CONFIG_TOOLCHAIN_DIR=${CONFIG_TOOLCHAIN_DIR}|g" .config
        
        # Заглушка версий Git (убирает ошибку превышения 64 символов)
        echo '#!/bin/sh' > linux-3.4.x/scripts/setlocalversion
        echo 'echo ""' >> linux-3.4.x/scripts/setlocalversion
        chmod +x linux-3.4.x/scripts/setlocalversion
        
        # Автоматический обход интерактивных вопросов Kconfig
        sed -i 's/silentoldconfig/oldnoconfig silentoldconfig/g' linux-3.4.x/scripts/kconfig/Makefile
        sed -i 's/silentoldconfig/oldnoconfig silentoldconfig/g' Makefile
        sed -i 's/silentoldconfig/oldnoconfig silentoldconfig/g' linux-3.4.x/Makefile
        
        # Классическая сборка прошивки Padavan через make
        make clean
        make -j$(nproc)
        
        sudo mv -f images/*.trx /opt/images/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Padavan_SmartBox_Turbo_Plus_New_NG
        path: /opt/images/*.trx
