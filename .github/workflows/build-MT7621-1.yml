name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Read build rules and MI-R3G 0x200000 partition layout
      run: |
        BASE="https://github.com"
        git clone --depth=1 "${BASE}/tsl0922/padavan-4.4.git" padavan-4.4
        cd padavan-4.4

        echo "=== 1. КОРНЕВОЙ Makefile И WORKFLOWS ==="
        cat Makefile
        ls -la .github/workflows/ || true
        cat .github/workflows/* 2>/dev/null || true

        echo "=== 2. РАЗМЕТКА РАЗДЕЛОВ В mtk_partition.h ==="
        cat trunk/linux-4.4.x/drivers/mtd/nand/mtk_partition.h

        echo "=== 3. НАСТРОЙКИ ПЛАТЫ MI-R3G ==="
        cat trunk/configs/boards/MI-R3G/board.mk
        cat trunk/configs/templates/MI-R3G.config
