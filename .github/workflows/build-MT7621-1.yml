name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check libusb-1.0.23 file type
      run: |
        BASE="http://tinycorelinux.net"
        curl -fSL "${BASE}/11.x/x86/tcz/src/libusb/libusb-1.0.23.tar.bz2" -o /tmp/libusb-1.0.23.tar.bz2
        ls -lh /tmp/libusb-1.0.23.tar.bz2
        file /tmp/libusb-1.0.23.tar.bz2
