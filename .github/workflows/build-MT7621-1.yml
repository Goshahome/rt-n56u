name: Build MT7621-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Inspect Padavan 4.4 repository (hanwckf)
      run: |
        git clone --depth=1 https://github.com/hanwckf/rt-n56u.git padavan-4.4
        cd padavan-4.4
        
        echo "=== 1. КОРЕНЬ РЕПОЗИТОРИЯ И ВЕРСИИ ЯДЕР ==="
        ls -la
        ls -la trunk/
        
        echo "=== 2. ПЛАТЫ НА 128M NAND (RM2100 / R6220 / MI-R3G / SMBX) ==="
        find trunk/configs -iname "*rm2100*" -o -iname "*r6220*" -o -iname "*mi-r3g*" -o -iname "*smbx*"
        
        echo "=== 3. ФАЙЛЫ РАЗМЕТКИ РАЗДЕЛОВ В ЯДРЕ 4.4 ==="
        find trunk/linux-4.4.x/drivers/mtd -maxdepth 2 -iname "*part*" -o -iname "*mtd*" 2>/dev/null
